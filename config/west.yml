manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-nice-oled
      remote: mctechnology17
      # Pinned to a known commit instead of main. Tracking main means every
      # build pulled latest upstream changes — possible cause of subtle
      # regressions (the asymmetric central LED issue, the toggle keypath
      # not firing) that didn't exist when the user's keyboard worked.
      revision: 46f824abb29c50f00f4dd29f47b81586bba89dca
  self:
    path: config
