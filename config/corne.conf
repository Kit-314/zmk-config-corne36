# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# LEDs off by default — user toggles via RGB_TOG on layer 2 when wanted.
# BRT_START=20 = visibly dim. No BRT_MAX cap (was 40, which scaled the
# user-set brightness via MIN + (MAX-MIN) * b / 100 — making BRT_START=15
# output only ~6%, almost invisible).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
# DIAGNOSTIC: ON_START=y forces LEDs on at boot, bypassing the toggle keypath
# entirely. If LEDs visible at boot after this flash → toggle keypath was the
# bug (most likely state.on stuck true so RGB_TOG converts to RGB_OFF_CMD
# silently, per behavior_rgb_underglow.c:138-148 smart-toggle conversion).
# If LEDs still invisible at boot → deeper RGB driver issue (led_strip NULL,
# SPI3 init failure, etc.) and we look elsewhere.
# Revert to n once diagnostic is complete.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# RGB_UNDERGLOW_EXT_POWER left at ZMK default (y). Previously set to n to
# decouple from EXT_POWER, but that broke LED toggling entirely — LEDs
# never lit even with ON_START=y. Working state at 543e13b had this at
# default y. Reverting to test if this is the LED-driver-broken cause.
# The bricking-risk that motivated the n setting (EP_TOG combo) is gone:
# we removed the combo from the keymap, and AUTO_OFF_IDLE→ext_power_disable
# is a transient off-state that AUTO_OFF_USB / next-RGB-on will restore.
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable OLED Display with zmk-nice-oled custom portrait screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# zmk-nice-oled: portrait layout (32x128)
CONFIG_NICE_OLED_ON=y

# Central (left): layer label, battery %, BT output, WPM speedometer, Bongo Cat.
# With no CENTRAL_SHOW_BATTERY_PERIPHERAL_* option enabled, the standard battery
# widget is used which renders the percentage as text (e.g. "53%").
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

# Peripheral (right): SPACEMAN animation. 20 frames at 4800ms cycle = ~4 fps
# refresh. Astronaut visual — more interesting than HEAD which user reported
# "looks absolutely terrible". Typing-responsive on peripheral isn't possible
# in ZMK v0.3 (see kit-6l0), so constant slow animation is the best we can do.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Deep sleep disabled. ZMK's deep-sleep mechanism calls
# zmk_pm_suspend_devices() on ZMK_ACTIVITY_SLEEP, putting the nRF52840 into
# system_off mode. On this Keebmaker board, wake from system_off doesn't
# restart the display — only a manual power cycle brings it back. Since you
# use the physical power switch overnight anyway, deep sleep wasn't saving
# you anything practical. Trade: keyboard now idles at ~5–10mA instead of
# ~5µA, so battery lasts days instead of weeks — fine given the power switch.
CONFIG_ZMK_SLEEP=n

# 2-minute idle timeout. Drives BOTH LED auto-off and display blank:
#   - LEDs off after 2 min, auto-on when typing resumes (AUTO_OFF_IDLE=y)
#   - Display blanks after 2 min, unblanks on any keypress (BLANK_ON_IDLE=y)
# ZMK v0.3 only has one IDLE_TIMEOUT — separate timers for LED vs display
# would require a firmware fork. 2 min is the compromise: long enough that
# the display doesn't blank during reading/thinking, short enough that
# overnight battery drain via LEDs is bounded.
# Safe with ZMK_SLEEP=n: IDLE state never escalates to SLEEP, so the
# BLANK_ON_IDLE handler can reliably blank/unblank without the deep-sleep
# wake bug coming into play.
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Bump dedicated display thread stack from default 2560 → 4096. zmk-nice-oled's
# README recommends 3072+ when extra widgets are enabled. On the central we run
# WPM speedometer + bongo cat + layer + battery + output widgets, which appears
# to be overflowing the 2560 default and corrupting the static rgb_underglow
# pixels[] array in adjacent .bss — visible as the first ~12 LEDs being dark
# on the central while the peripheral lights all 24 correctly.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
