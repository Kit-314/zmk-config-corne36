# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Default RGB off, white at 40% brightness when on
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Enable OLED Display with zmk-nice-oled custom portrait screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y


# zmk-nice-oled: portrait layout (32x128), all animations, battery both sides
CONFIG_NICE_OLED_ON=y

# Central (left): minimalist — layer label, battery, BT output, WPM as a number
# (no speedometer/bongo-cat). With no CENTRAL_SHOW_BATTERY_PERIPHERAL_* option
# enabled, each half shows its own battery via the standard widget.
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# Peripheral (right): abstract gem animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Sleep disabled: ZMK_SLEEP enables Zephyr device PM which suspends the SSD1306
# driver after a few seconds, blanking the display permanently until power cycle.
# Battery life managed via RGB auto-off on idle/USB instead.
