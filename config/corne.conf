# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Default RGB off, white at 40% brightness when on
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Enable OLED Display
CONFIG_ZMK_DISPLAY=y
# Don't blank the OLED when idle (default y for SSD1306 caused blank screens on battery)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Show battery percentage as text alongside the icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# Show WPM counter bottom-right
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable deep sleep with a 15 minute timeout (timeout is a no-op without ZMK_SLEEP=y)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
