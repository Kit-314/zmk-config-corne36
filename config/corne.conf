# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Default RGB off, white at 40% brightness when on
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Enable OLED Display with zmk-nice-oled custom portrait screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Diagnostic: extend idle timeout to 10 min (default is 30s).
# If display now stays on ~10 min before blanking, BLANK_ON_IDLE is still
# active despite =n above (SSD1306 Kconfig conflict) and we know the fix.
# If it still goes off in seconds, it's something else entirely.
CONFIG_ZMK_IDLE_TIMEOUT=600000

# zmk-nice-oled: portrait layout (32x128), all animations, battery both sides
CONFIG_NICE_OLED_ON=y

# Central (left): layer, battery, BT output, WPM speedometer, Bongo Cat typing animation
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# Peripheral (right): Pokemon animation (closest to a dinosaur)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Sleep after 15 minutes of inactivity
# Deep sleep is a full hardware reset on wake, so display reinitialises cleanly
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
